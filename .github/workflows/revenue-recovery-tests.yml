name: LASETA Recovery Estimator Tests

on:
  push:
    branches: [main]
    paths:
      - 'revenue-recovery-calculator-core.js'
      - 'revenue-recovery-estimator-ui.js'
      - 'tests/revenue-recovery-calculator-core.test.js'
      - '.github/workflows/revenue-recovery-tests.yml'
  pull_request:
    paths:
      - 'revenue-recovery-calculator-core.js'
      - 'revenue-recovery-estimator-ui.js'
      - 'tests/revenue-recovery-calculator-core.test.js'
      - '.github/workflows/revenue-recovery-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run calculator tests
        run: node --test tests/revenue-recovery-calculator-core.test.js
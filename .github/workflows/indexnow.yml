name: Submit IndexNow

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'request.html'
      - 'recover.html'
      - 'automate.html'
      - 'adfactory.html'
      - 'consumer-services.html'
      - 'guides.html'
      - 'guides/**'
      - 'business/**'
      - 'ar/**'
      - 'es/**'
      - 'fr/**'
      - 'pt/**'
      - 'hi/**'
      - 'id/**'
      - 'job-application-support-saudi-arabia.html'
      - 'whatsapp-sales-kit-saudi-arabia.html'
      - 'university-admissions-scholarship-saudi-arabia.html'
      - 'home-service-quote-comparison-riyadh.html'
      - 'move-in-setup-concierge-riyadh.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'bc6685b036b95e0b05a95901c83fa3aa.txt'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit LASETA URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data '{
              "host": "laseta.net",
              "key": "bc6685b036b95e0b05a95901c83fa3aa",
              "keyLocation": "https://laseta.net/bc6685b036b95e0b05a95901c83fa3aa.txt",
              "urlList": [
                "https://laseta.net/",
                "https://laseta.net/ar/",
                "https://laseta.net/es/",
                "https://laseta.net/fr/",
                "https://laseta.net/pt/",
                "https://laseta.net/hi/",
                "https://laseta.net/id/",
                "https://laseta.net/request.html",
                "https://laseta.net/ar/request.html",
                "https://laseta.net/recover.html",
                "https://laseta.net/ar/recover.html",
                "https://laseta.net/automate.html",
                "https://laseta.net/ar/automate.html",
                "https://laseta.net/adfactory.html",
                "https://laseta.net/ar/adfactory.html",
                "https://laseta.net/business/contractors-revenue-recovery.html",
                "https://laseta.net/business/real-estate-lead-automation.html",
                "https://laseta.net/business/clinics-lead-followup.html",
                "https://laseta.net/business/ecommerce-revenue-recovery.html",
                "https://laseta.net/business/professional-services-sales-automation.html",
                "https://laseta.net/consumer-services.html",
                "https://laseta.net/ar/consumer-services.html",
                "https://laseta.net/guides.html",
                "https://laseta.net/job-application-support-saudi-arabia.html",
                "https://laseta.net/ar/job-application-support-saudi-arabia.html",
                "https://laseta.net/whatsapp-sales-kit-saudi-arabia.html",
                "https://laseta.net/ar/whatsapp-sales-kit-saudi-arabia.html",
                "https://laseta.net/university-admissions-scholarship-saudi-arabia.html",
                "https://laseta.net/ar/university-admissions-scholarship-saudi-arabia.html",
                "https://laseta.net/home-service-quote-comparison-riyadh.html",
                "https://laseta.net/ar/home-service-quote-comparison-riyadh.html",
                "https://laseta.net/move-in-setup-concierge-riyadh.html",
                "https://laseta.net/ar/move-in-setup-concierge-riyadh.html",
                "https://laseta.net/guides/ats-cv-saudi-arabia.html",
                "https://laseta.net/guides/tailor-cv-to-job-saudi-arabia.html",
                "https://laseta.net/guides/university-admission-checklist-saudi-arabia.html",
                "https://laseta.net/guides/whatsapp-business-selling-saudi-arabia.html",
                "https://laseta.net/guides/compare-home-service-quotes-riyadh.html",
                "https://laseta.net/guides/move-in-checklist-riyadh.html"
              ]
            }'
          echo 'IndexNow submission accepted for multilingual B2B and B2C LASETA pages.'
